services:
  postgres:
    image: postgres:16-alpine
    container_name: customer360-postgres
    environment:
      POSTGRES_DB: customer360
      POSTGRES_USER: customer360
      POSTGRES_PASSWORD: customer360
    ports:
      - "5433:5432"
    volumes:
      - customer360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer360 -d customer360"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  customer360_pgdata:
